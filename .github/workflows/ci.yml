name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manifest can rot without anyone touching it — a plugin repo gets renamed
  # or made private, and installs break silently. Weekly, so we hear it first.
  schedule:
    - cron: "0 7 * * 1"

jobs:
  validate:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --network resolves every referenced repo, which is the failure that
      # actually reaches users; the offline checks alone would not catch it.
      - run: python3 scripts/validate-marketplace.py --network
